services:
  # Backend API Service
  - type: web
    name: spedxpay-backend
    env: node
    region: oregon
    plan: starter
    branch: main

    buildCommand: yarn install && yarn build   # installs + compiles TypeScript
    startCommand: yarn start   # runs node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_VERSION
        value: v1
      # Database
      - key: MONGODB_URI
        sync: false
      # JWT
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      # Resend Email
      - key: RESEND_API_KEY
        sync: false
      # Paystack
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      # MTN MoMo Sandbox
      - key: MTN_MOMO_SUBSCRIPTION_KEY
        sync: false
      - key: MTN_MOMO_API_USER
        sync: false
      - key: MTN_MOMO_API_KEY
        sync: false
      - key: MTN_MOMO_ENVIRONMENT
        value: sandbox
      # Cloudinary (optional)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # AWS S3 (optional)
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_S3_BUCKET
        sync: false
      # Rates API
      - key: COINGECKO_API_KEY
        sync: false
      # Encryption
      - key: ENCRYPTION_KEY
        generateValue: true
      # Admin
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Platform Payment Info
      - key: PLATFORM_BTC_WALLET
        sync: false
      - key: PLATFORM_ETH_WALLET
        sync: false
      - key: PLATFORM_USDT_WALLET
        sync: false
      - key: PLATFORM_LTC_WALLET
        sync: false
      - key: PLATFORM_XRP_WALLET
        sync: false
      - key: PLATFORM_MOMO_NUMBER
        sync: false
      - key: PLATFORM_BANK_NAME
        sync: false
      - key: PLATFORM_BANK_ACCOUNT
        sync: false
      - key: PLATFORM_BANK_ACCOUNT_NAME
        sync: false
      # Logging
      - key: LOG_LEVEL
        value: info
    healthCheckPath: /health
    autoDeploy: true

databases:
